spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_agent
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    vectorstore:
      pgvector:
        initialize-schema: true     # PG vector store auto-create table
        index-type: ivfflat
        distance-type: cosine_distance
        dimensions: 2048            # embedding-2 output dimension
        schema-name: public
        table-name: picture_vector_store

app:
  vector:
    type: postgres
  rag:
    retrieve-favorites-only: false  # hybrid search filters by favorited in SQL
