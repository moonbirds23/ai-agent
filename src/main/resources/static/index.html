<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云图库 AI 助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:16px/1.6 'Microsoft YaHei',sans-serif;background:#f0f2f5;display:flex;justify-content:center;height:100vh}
#app{width:100%;max-width:800px;display:flex;flex-direction:column;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08)}
#header{padding:16px 20px;border-bottom:1px solid #eee;font-size:18px;font-weight:600;color:#333;display:flex;align-items:center;gap:12px}
#header span{flex:1}
#mode-toggle{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;cursor:pointer;user-select:none}
#mode-toggle input{display:none}
.toggle-track{width:44px;height:24px;background:#d9d9d9;border-radius:12px;position:relative;transition:background .2s}
.toggle-track.on{background:#1890ff}
.toggle-track::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle-track.on::after{transform:translateX(20px)}
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:85%;padding:10px 14px;border-radius:12px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
.bubble.user{align-self:flex-end;background:#1890ff;color:#fff;border-bottom-right-radius:4px}
.bubble.assistant{align-self:flex-start;background:#f5f5f5;color:#333;border-bottom-left-radius:4px}
.bubble.error{align-self:center;background:#fff2f0;color:#ff4d4f;border:1px solid #ffccc7;font-size:14px}
.bubble img{max-width:100%;border-radius:8px;margin-top:8px}
.image-actions{margin-top:8px;display:flex;gap:8px}
.image-actions button{padding:6px 12px;border:1px solid #1890ff;background:#fff;color:#1890ff;border-radius:6px;cursor:pointer;font-size:13px}
.image-actions button:hover{background:#e6f4ff}
.prompt-detail{margin-top:10px;border-top:1px solid #e8e8e8;padding-top:8px;font-size:13px;color:#555}
.prompt-detail summary{cursor:pointer;color:#1890ff;user-select:none}
.prompt-detail pre{margin-top:8px;white-space:pre-wrap;word-break:break-word;font-family:inherit;line-height:1.5}
#chatId-hint{font-size:11px;color:#bbb;text-align:right;padding:4px 20px;font-family:monospace}
#input-area{display:flex;gap:10px;padding:16px 20px;border-top:1px solid #eee;align-items:flex-end}
#preview-area{display:none;padding:4px 20px 0;position:relative}
#preview-area img{max-width:120px;max-height:120px;border-radius:8px;border:1px solid #eee}
#preview-area .remove{position:absolute;top:6px;left:128px;background:#ff4d4f;color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;line-height:1}
#analyze-image{margin-left:16px;vertical-align:top;padding:6px 12px;border:1px solid #1890ff;background:#fff;color:#1890ff;border-radius:6px;cursor:pointer;font-size:13px}
#analyze-image:hover{background:#e6f4ff}#analyze-image:disabled{border-color:#d9d9d9;color:#aaa;cursor:not-allowed;background:#fff}
#image-upload{width:36px;height:36px;border:1px dashed #d9d9d9;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;flex-shrink:0}
#image-upload:hover{border-color:#1890ff;color:#1890ff}
#image-input{display:none}
#input{flex:1;padding:10px 14px;border:1px solid #d9d9d9;border-radius:8px;font-size:15px;outline:none;resize:none}
#input:focus{border-color:#1890ff;box-shadow:0 0 0 2px rgba(24,144,255,.15)}
#send{padding:10px 24px;background:#1890ff;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;white-space:nowrap}
#send:hover{background:#40a9ff}#send:disabled{background:#d9d9d9;cursor:not-allowed}
#progress-bar{display:none;height:3px;background:#1890ff;width:100%}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <span>云图库 AI 图片生成助手</span>
    <label id="mode-toggle" title="开启后基于历史对话生成图片">
      <input type="checkbox" id="gen-mode" onchange="onModeChange()">
      <span class="toggle-track" id="toggle-track"></span>
      <span id="mode-label">生成模式</span>
    </label>
    <button onclick="newSession()" style="padding:4px 12px;background:none;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;cursor:pointer;color:#666">+ 新对话</button>
  </div>
  <div id="progress-bar"></div>
  <div id="chatId-hint"></div>
  <div id="messages">
    <div class="bubble assistant">你好，我是AI图片生成助手。描述你想要的图片，我来帮你生成。</div>
  </div>
  <div id="preview-area">
    <img id="preview-img" src="" alt="预览">
    <button class="remove" onclick="clearImage()">&times;</button>
    <button id="analyze-image" onclick="analyzeImage()">分析图片</button>
  </div>
  <div id="input-area">
    <label id="image-upload" title="上传图片">
      &#128247;
      <input type="file" id="image-input" accept="image/png,image/jpeg,image/jpg,image/webp,image/gif" onchange="onImageSelect(event)">
    </label>
    <input id="input" placeholder="描述你想要的图片..." autofocus>
    <button id="send" onclick="send()">发送</button>
  </div>
</div>

<script>
const messages = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const hint = document.getElementById('chatId-hint');
const genMode = document.getElementById('gen-mode');
const toggleTrack = document.getElementById('toggle-track');
const modeLabel = document.getElementById('mode-label');
const previewArea = document.getElementById('preview-area');
const previewImg = document.getElementById('preview-img');
const progressBar = document.getElementById('progress-bar');
const analyzeBtn = document.getElementById('analyze-image');
let chatId = null;
let sending = false;
let imageBase64 = null;

input.addEventListener('keydown', e => { if(e.key==='Enter' && !sending) send(); });

function setChatId(id) {
  chatId = id;
  hint.textContent = id ? '会话 ' + id.substring(0,8) : '';
}

function newSession() {
  setChatId(null);
  messages.innerHTML = '<div class="bubble assistant">你好，我是AI图片生成助手。描述你想要的图片，我来帮你生成。</div>';
  clearImage();
}

function onModeChange() {
  const on = genMode.checked;
  toggleTrack.className = 'toggle-track' + (on ? ' on' : '');
  modeLabel.textContent = on ? '生成模式(开)' : '生成模式';
}

function onImageSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    imageBase64 = reader.result;
    previewImg.src = reader.result;
    previewArea.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function clearImage() {
  imageBase64 = null;
  previewImg.src = '';
  previewArea.style.display = 'none';
  document.getElementById('image-input').value = '';
}

function addBubble(role, text, id) {
  const div = document.createElement('div');
  div.className = 'bubble ' + role;
  if(id) div.id = id;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

function showImage(data) {
  const div = document.createElement('div');
  div.className = 'bubble assistant';
  const src = data.imageUrl || data.imageBase64;
  if (src) {
    const img = document.createElement('img');
    img.src = src;
    img.onload = () => { messages.scrollTop = messages.scrollHeight; };
    div.appendChild(img);
    if (data.imageUrl) {
      const actions = document.createElement('div');
      actions.className = 'image-actions';
      const downloadBtn = document.createElement('button');
      downloadBtn.textContent = '下载图片';
      downloadBtn.onclick = () => window.open('/api/image/download?url=' + encodeURIComponent(data.imageUrl), '_blank');
      actions.appendChild(downloadBtn);
      div.appendChild(actions);
    }
    const promptText = formatGeneratedPrompt(data);
    if (promptText) {
      const details = document.createElement('details');
      details.className = 'prompt-detail';
      details.open = true;
      const summary = document.createElement('summary');
      summary.textContent = '本次使用的 Prompt';
      const pre = document.createElement('pre');
      pre.textContent = promptText;
      details.appendChild(summary);
      details.appendChild(pre);
      div.appendChild(details);
    }
  }
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function formatGeneratedPrompt(data) {
  const parts = [];
  if (data.imagePrompt) parts.push('Prompt：\n' + data.imagePrompt);
  if (data.style) parts.push('风格：' + data.style);
  if (data.dimensions) parts.push('尺寸：' + data.dimensions);
  if (data.revisedPrompt) parts.push('修订提示词：\n' + data.revisedPrompt);
  return parts.join('\n\n');
}

function formatChatData(data) {
  const parts = [];
  if (data.message) parts.push(data.message);
  const promptLabel = data.type === 'image_analyzed' ? '可复用提示词：' : '优化提示词：';
  const detailLabel = data.type === 'image_analyzed' ? '图片分析详情：' : '修订提示词：';
  if (data.imagePrompt) parts.push(promptLabel + '\n' + data.imagePrompt);
  if (data.style) parts.push('风格：' + data.style);
  if (data.dimensions) parts.push('尺寸：' + data.dimensions);
  if (data.revisedPrompt) parts.push(detailLabel + '\n' + data.revisedPrompt);
  return parts.join('\n\n') || '已完成处理';
}

function send() {
  sendWithMode(genMode.checked ? 'image_generation' : 'chat');
}

function analyzeImage() {
  sendWithMode('image_analysis');
}

async function sendWithMode(mode) {
  const text = input.value.trim();
  if(sending) return;
  if(mode !== 'image_analysis' && !text) return;
  if(mode === 'image_analysis' && !imageBase64) {
    addBubble('error', '请先上传需要分析的图片');
    return;
  }
  sending = true;
  sendBtn.disabled = true;
  analyzeBtn.disabled = true;
  input.value = '';
  input.focus();

  const displayText = text || '分析这张图片';
  addBubble('user', displayText);
  const assistantBubble = addBubble('assistant', '', 'streaming');
  let fullText = '';

  try {
    const body = {
      message: displayText,
      chatId: chatId,
      generationMode: mode === 'image_generation',
      mode: mode,
      imageBase64: imageBase64
    };
    const resp = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    clearImage();

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while(true) {
      const {done, value} = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, {stream:true});
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for(const line of lines) {
        if(!line.startsWith('data:')) continue;
        try {
          const event = JSON.parse(line.slice(5).trim());
          switch(event.type) {
            case 'chatId':
              setChatId(event.chatId);
              break;
            case 'token':
              fullText += event.content;
              assistantBubble.textContent = fullText;
              messages.scrollTop = messages.scrollHeight;
              break;
            case 'done':
              if (event.data) {
                if (event.data.type === 'image_generated') {
                  assistantBubble.remove();
                  showImage(event.data);
                } else {
                  assistantBubble.textContent = formatChatData(event.data);
                }
              }
              progressBar.style.display = 'none';
              messages.scrollTop = messages.scrollHeight;
              break;
            case 'progress':
              assistantBubble.textContent = event.content || '生成中...';
              progressBar.style.display = 'block';
              messages.scrollTop = messages.scrollHeight;
              break;
            case 'error':
              assistantBubble.className = 'bubble error';
              assistantBubble.textContent = event.content;
              progressBar.style.display = 'none';
              break;
          }
        } catch(e) { /* skip bad lines */ }
      }
    }
  } catch(e) {
    assistantBubble.className = 'bubble error';
    assistantBubble.textContent = '网络异常，请重试';
    progressBar.style.display = 'none';
  } finally {
    sending = false;
    sendBtn.disabled = false;
    analyzeBtn.disabled = false;
    input.focus();
  }
}
</script>
</body>
</html>
