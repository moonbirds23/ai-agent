<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云图库 AI 助手 — 调试台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.5 'Microsoft YaHei',sans-serif;background:#e8ecf1;display:flex;justify-content:center;height:100vh;overflow:hidden}
#app{width:100%;height:100vh;display:flex;flex-direction:column;background:#e8ecf1}

/* ====== Header ====== */
#header{padding:10px 16px;background:#fff;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;gap:12px;flex-shrink:0}
#header .title{flex:1;font-size:16px;font-weight:600;color:#1a1a2e;display:flex;align-items:center;gap:8px}
#header .title .badge{font-size:11px;padding:1px 8px;background:#e6f4ff;color:#1890ff;border-radius:10px;font-weight:400}
#header button.new-session{padding:5px 14px;background:#fff;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;cursor:pointer;color:#555}
#header button.new-session:hover{border-color:#1890ff;color:#1890ff}
#chatId-hint{font-size:11px;color:#bbb;font-family:monospace}

/* ====== 3-column body ====== */
#body{flex:1;display:grid;grid-template-columns:300px 1fr 300px;overflow:hidden;gap:0}
@media(max-width:1100px){#body{grid-template-columns:260px 1fr 260px}}
@media(max-width:900px){#body{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}}
#body>*{overflow-y:auto;overflow-x:hidden}

/* ====== Panels ====== */
.panel{background:#fff;display:flex;flex-direction:column;overflow:hidden}
.panel.left{border-right:1px solid #e8e8e8}
.panel.right{border-left:1px solid #e8e8e8;background:#f8f9fb}
.panel-header{padding:10px 14px;border-bottom:1px solid #f0f0f0;font-size:13px;font-weight:600;color:#555;display:flex;align-items:center;gap:6px;flex-shrink:0}
.panel-header .icon{font-size:14px}
.panel-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px}

/* ====== Gallery panel ====== */
.gallery-actions{display:flex;gap:6px;padding:0 0 10px;flex-wrap:wrap}
.gallery-actions button{padding:5px 10px;border:1px solid #d9d9d9;background:#fff;border-radius:5px;font-size:12px;cursor:pointer;color:#555;white-space:nowrap}
.gallery-actions button:hover{border-color:#1890ff;color:#1890ff}
.gallery-actions button.primary{background:#1890ff;color:#fff;border-color:#1890ff}
.gallery-actions button.primary:hover{background:#40a9ff}
.gallery-actions input[type=text]{flex:1;min-width:100px;padding:5px 8px;border:1px solid #d9d9d9;border-radius:5px;font-size:12px;outline:none}
.gallery-actions input[type=text]:focus{border-color:#1890ff}
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:1100px){.gallery-grid{grid-template-columns:repeat(2,1fr)}}
.gallery-card{position:relative;border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;background:#fafafa;transition:border-color .15s}
.gallery-card:hover{border-color:#b3d8ff}
.gallery-card.selected{border-color:#1890ff;box-shadow:0 0 0 1px #1890ff}
.gallery-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.gallery-card .meta{padding:4px 6px}
.gallery-card .name{font-size:11px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gallery-card .row{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.gallery-card .star{cursor:pointer;font-size:13px;user-select:none}
.gallery-card .star.fav{color:#faad14}
.gallery-card .star:not(.fav){color:#ccc}
.gallery-card .analyze{font-size:10px;color:#1890ff;cursor:pointer;text-decoration:underline}
.gallery-card .analyze:hover{color:#40a9ff}
.gallery-card .delete-btn{font-size:12px;color:#ff4d4f;cursor:pointer;margin-left:6px;font-weight:700}
.gallery-card .delete-btn:hover{color:#ff7875}
#upload-form button:disabled{opacity:.6;cursor:not-allowed}
.gallery-card .overlay{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:3px;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:11px;color:#1890ff;opacity:0;transition:opacity .15s}
.gallery-card.selected .overlay,.gallery-card:hover .overlay{opacity:1}

/* ====== Modal ====== */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100}
.modal-box{background:#fff;border-radius:10px;padding:20px 24px;min-width:320px;max-width:420px;box-shadow:0 4px 20px rgba(0,0,0,.12)}
.modal-box h3{font-size:15px;margin-bottom:14px;color:#333}
.modal-box label{display:block;font-size:12px;color:#888;margin-bottom:4px;margin-top:10px}
.modal-box input,.modal-box textarea{width:100%;padding:7px 10px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;outline:none;font-family:inherit}
.modal-box textarea{height:60px;resize:vertical}
.modal-box input:focus,.modal-box textarea:focus{border-color:#1890ff}
.modal-box .btns{margin-top:16px;display:flex;gap:10px;justify-content:flex-end}
.modal-box .btns button{padding:6px 16px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid #d9d9d9;background:#fff;color:#555}
.modal-box .btns button.ok{background:#1890ff;color:#fff;border-color:#1890ff}
.modal-box .btns button.ok:hover{background:#40a9ff}

/* ====== Chat panel ====== */
#messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:85%;padding:10px 14px;border-radius:12px;line-height:1.5;word-break:break-word;white-space:pre-wrap;font-size:14px}
.bubble.user{align-self:flex-end;background:#1890ff;color:#fff;border-bottom-right-radius:4px}
.bubble.assistant{align-self:flex-start;background:#f5f5f5;color:#333;border-bottom-left-radius:4px}
.bubble.error{align-self:center;background:#fff2f0;color:#ff4d4f;border:1px solid #ffccc7;font-size:13px}
.bubble img{max-width:100%;border-radius:8px;margin-top:8px}
.image-actions{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.image-actions button{padding:4px 10px;border:1px solid #1890ff;background:#fff;color:#1890ff;border-radius:6px;cursor:pointer;font-size:12px}
.image-actions button:hover{background:#e6f4ff}
.prompt-detail{margin-top:10px;border-top:1px solid #e8e8e8;padding-top:8px;font-size:12px;color:#666}
.prompt-detail summary{cursor:pointer;color:#1890ff;user-select:none;font-size:13px}
.prompt-detail pre{margin-top:6px;white-space:pre-wrap;word-break:break-word;font-family:inherit;line-height:1.5;background:#fafafa;padding:8px;border-radius:4px}

/* ====== Mode tabs ====== */
#mode-tabs{display:flex;gap:0;padding:0 20px;border-bottom:1px solid #f0f0f0;flex-shrink:0;align-items:center}
#mode-tabs .tab{padding:8px 16px;font-size:13px;cursor:pointer;color:#888;border-bottom:2px solid transparent;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
#mode-tabs .tab:hover{color:#1890ff}
#mode-tabs .tab.active{color:#1890ff;border-bottom-color:#1890ff;font-weight:600}
#mode-tabs .mode-label{padding:10px 16px;font-size:13px;color:#1890ff;font-weight:500}

/* ====== Input area ====== */
#input-area{display:flex;gap:8px;padding:12px 20px;border-top:1px solid #eee;align-items:flex-end;flex-shrink:0}
#preview-area{display:none;padding:4px 20px 0;position:relative;flex-shrink:0}
#preview-area img{max-width:100px;max-height:100px;border-radius:8px;border:1px solid #eee}
#preview-area .remove{position:absolute;top:5px;left:108px;background:#ff4d4f;color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;line-height:1}
#image-upload{width:34px;height:34px;border:1px dashed #d9d9d9;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;flex-shrink:0;color:#999}
#image-upload:hover{border-color:#1890ff;color:#1890ff}
#image-input{display:none}
#input{flex:1;padding:9px 12px;border:1px solid #d9d9d9;border-radius:8px;font-size:14px;outline:none;resize:none;font-family:inherit;min-height:38px;max-height:120px}
#input:focus{border-color:#1890ff;box-shadow:0 0 0 2px rgba(24,144,255,.12)}
#send{padding:9px 20px;background:#1890ff;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;white-space:nowrap;flex-shrink:0}
#send:hover{background:#40a9ff}#send:disabled{background:#d9d9d9;cursor:not-allowed}
#progress-bar{display:none;height:2px;background:#1890ff;width:100%;flex-shrink:0;transition:width .3s}

/* ====== Right panel ====== */
.right-section{margin-bottom:16px}
.right-section .sec-title{font-size:12px;font-weight:600;color:#888;margin-bottom:8px;display:flex;align-items:center;gap:4px;text-transform:uppercase;letter-spacing:.5px}
.ref-list{display:flex;flex-wrap:wrap;gap:6px;min-height:40px}
.ref-item{position:relative;width:64px;height:64px;border-radius:6px;overflow:hidden;border:2px solid #1890ff}
.ref-item img{width:100%;height:100%;object-fit:cover}
.ref-item .del{position:absolute;top:2px;right:2px;width:16px;height:16px;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.ref-empty{font-size:11px;color:#bbb;padding:8px 0}
.rag-retrieved{display:flex;flex-wrap:wrap;gap:6px}
.rag-card{width:72px;text-align:center}
.rag-card img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid #e8e8e8;display:block}
.rag-card .score{font-size:10px;color:#888;margin-top:2px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.toggle-row .lbl{font-size:13px;color:#333}
.toggle-row .sublbl{font-size:11px;color:#999;margin-left:4px}
.toggle-switch{position:relative;width:40px;height:22px;border-radius:11px;background:#d9d9d9;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle-switch.on{background:#1890ff}
.toggle-switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle-switch.on::after{transform:translateX(18px)}
select, .right-select{width:100%;padding:6px 8px;border:1px solid #d9d9d9;border-radius:6px;font-size:12px;outline:none;background:#fff;color:#333}
select:focus,.right-select:focus{border-color:#1890ff}
.debug-block{border:1px solid #e8e8e8;border-radius:6px;overflow:hidden;margin-top:4px}
.debug-block summary{padding:6px 10px;background:#f5f5f5;font-size:12px;color:#555;cursor:pointer;user-select:none}
.debug-block summary:hover{background:#eee}
.debug-block pre{padding:10px;font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-word;font-family:'Consolas','Courier New',monospace;max-height:200px;overflow-y:auto;color:#333;background:#fff}

/* ====== Inline upload modal ====== */
.inline-form{padding:8px;background:#fafafa;border-radius:6px;margin-bottom:8px;display:none}
.inline-form.show{display:block}
.inline-form input,.inline-form textarea{width:100%;padding:5px 8px;border:1px solid #d9d9d9;border-radius:4px;font-size:12px;margin-top:4px;font-family:inherit;outline:none}
.inline-form textarea{height:40px;resize:vertical}
.inline-form .row{display:flex;gap:6px;margin-top:6px}
.inline-form .row button{padding:4px 12px;border-radius:4px;font-size:12px;cursor:pointer;border:1px solid #d9d9d9;background:#fff}
.inline-form .row button.confirm{background:#1890ff;color:#fff;border-color:#1890ff}

/* ====== Misc ====== */
.placeholder{font-size:11px;color:#bbb;padding:12px 0;text-align:center}
.gallery-loading{font-size:12px;color:#999;text-align:center;padding:20px}
.toast{position:fixed;top:20px;right:20px;background:#333;color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:200;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}

/* ====== Tool progress timeline ====== */
.tool-call-bubble{align-self:flex-start;max-width:85%;padding:7px 12px;font-size:12px;color:#555;background:#f0f7ff;border-radius:8px;border-left:3px solid #1890ff;display:block;flex-shrink:0;white-space:pre-wrap;word-break:break-word}
.tool-call-bubble.active{background:#f0f7ff;border-left-color:#1890ff}
.tool-call-bubble.complete{background:#f6ffed;border-left-color:#52c41a}
.tool-call-bubble.error{background:#fff2f0;border-left-color:#ff4d4f;color:#ff4d4f}
.tool-call-bubble .tc-head{display:flex;align-items:center;gap:6px;margin-bottom:3px;font-weight:600;color:#1890ff}
.tool-call-bubble.complete .tc-head{color:#52c41a}
.tool-call-bubble.error .tc-head{color:#ff4d4f}
.tool-call-bubble .tc-status{font-size:11px;color:#999;font-weight:400}
.tool-call-bubble .tc-label{font-weight:500}

.chat-image-block{margin:6px 0;padding:6px;background:#fafafa;border-radius:8px;display:inline-block}
.save-to-gallery-btn{padding:3px 10px;font-size:11px;background:#1890ff;color:#fff;border:none;border-radius:4px;cursor:pointer;margin-top:4px}
.save-to-gallery-btn:hover{background:#40a9ff}
</style>
</head>
<body>
<div id="app">
  <!-- ========== HEADER ========== -->
  <div id="header">
    <div class="title">云图库 AI 助手 <span class="badge">调试台</span></div>
    <span id="chatId-hint"></span>
    <button class="new-session" onclick="newSession()">+ 新对话</button>
  </div>

  <!-- ========== 3-COLUMN BODY ========== -->
  <div id="body">
    <!-- ===== LEFT: Gallery ===== -->
    <div class="panel left" id="left-panel">
      <div class="panel-header"><span class="icon">&#128247;</span> 图库</div>
      <div class="panel-body" id="gallery-body">
        <div class="gallery-actions">
          <button onclick="showUploadForm()" class="primary">上传图片</button>
          <button onclick="showImportDialog()">URL导入</button>
          <input type="text" id="gallery-search" placeholder="搜索..." onkeydown="if(event.key==='Enter')loadGallery()">
          <button onclick="loadGallery()" style="flex-shrink:0">搜索</button>
        </div>

        <div class="inline-form" id="upload-form">
          <div class="row" style="margin-top:0">
            <button onclick="triggerFilePicker()">选择文件</button>
            <span id="upload-file-name" style="font-size:11px;color:#888;line-height:28px">未选择文件</span>
          </div>
          <input type="text" id="upload-name" placeholder="图片名称（可选）">
          <input type="text" id="upload-category" placeholder="分类（可选，如: 风景, 人物）">
          <input type="text" id="upload-tags" placeholder="标签（可选，逗号分隔）">
          <div class="row">
            <button class="confirm" onclick="doUpload()">确认上传</button>
            <button onclick="hideUploadForm()">取消</button>
          </div>
        </div>

        <input type="file" id="hidden-file-input" accept="image/png,image/jpeg,image/jpg,image/webp,image/gif" style="display:none" multiple onchange="onUploadFileSelect(event)">

        <div class="gallery-grid" id="gallery-grid">
          <div class="gallery-loading">加载中...</div>
        </div>
      </div>
    </div>

    <!-- ===== CENTER: Chat ===== -->
    <div class="panel" id="center-panel">
      <div id="mode-tabs">
        <span class="mode-label">🤖 AI 智能助手 — 说出你的需求，我来处理</span>
      </div>
      <div id="progress-bar"></div>
      <div id="messages">
        <div class="bubble assistant">你好，我是AI图片生成助手。描述你想要的图片，我来帮你生成。</div>
      </div>
      <div id="preview-area">
        <img id="preview-img" src="" alt="预览">
        <button class="remove" onclick="clearImage()">&times;</button>
      </div>
      <div id="input-area">
        <label id="image-upload" title="上传图片分析/参考">
          &#128247;
          <input type="file" id="image-input" accept="image/png,image/jpeg,image/jpg,image/webp,image/gif" onchange="onChatImageSelect(event)">
        </label>
        <textarea id="input" placeholder="描述你想要的图片..." rows="1"></textarea>
        <button id="send" onclick="send()">发送</button>
      </div>
    </div>

    <!-- ===== RIGHT: Reference & Debug ===== -->
    <div class="panel right" id="right-panel">
      <div class="panel-header"><span class="icon">&#9881;</span> 参考与调试</div>
      <div class="panel-body" id="debug-body">

        <!-- Explicit references -->
        <div class="right-section">
          <div class="sec-title">显式参考图</div>
          <div class="ref-list" id="ref-list">
            <div class="ref-empty">从左侧图库点击图片添加参考</div>
          </div>
          <div style="margin-top:6px">
            <select id="reference-mode" class="right-select">
              <option value="COMPREHENSIVE">综合参考</option>
              <option value="STYLE">参考风格</option>
              <option value="COLOR">参考色彩</option>
              <option value="COMPOSITION">参考构图</option>
            </select>
          </div>
        </div>

        <!-- RAG settings -->
        <div class="right-section">
          <div class="sec-title">RAG 设置</div>
          <div class="toggle-row">
            <span class="lbl">启用历史收藏图检索<span class="sublbl">useGalleryRag</span></span>
            <div class="toggle-switch on" id="rag-toggle" onclick="toggleRag()"></div>
          </div>
          <div class="toggle-row" style="margin-top:4px">
            <span class="lbl">生成后保存到图库<span class="sublbl">saveGeneratedToGallery</span></span>
            <div class="toggle-switch" id="save-toggle" onclick="toggleSave()"></div>
          </div>
        </div>

        <!-- Style template -->
        <div class="right-section">
          <div class="sec-title">风格模板</div>
          <select id="template-select" class="right-select">
            <option value="">自动匹配</option>
          </select>
        </div>

        <!-- RAG retrieved results -->
        <div class="right-section" id="rag-results-section" style="display:none">
          <div class="sec-title">RAG 召回结果</div>
          <div class="rag-retrieved" id="rag-retrieved"></div>
        </div>

        <!-- Matched template -->
        <div class="right-section" id="matched-template-section" style="display:none">
          <div class="sec-title">命中模板</div>
          <div id="matched-template-info" style="font-size:12px;color:#555"></div>
        </div>

        <!-- Final enhanced prompt -->
        <div class="right-section" id="debug-prompt-section" style="display:none">
          <div class="sec-title">最终增强 Prompt</div>
          <details class="debug-block" id="debug-prompt-block">
            <summary>点击展开最终 Prompt</summary>
            <pre id="debug-prompt-text"></pre>
          </details>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Modal for URL import -->
<div class="modal-mask" id="import-modal" style="display:none">
  <div class="modal-box">
    <h3>URL 导入图片</h3>
    <label>图片URL</label>
    <input type="text" id="import-url-input" placeholder="https://example.com/image.jpg">
    <label>名称（可选）</label>
    <input type="text" id="import-name-input" placeholder="图片名称">
    <label>分类（可选）</label>
    <input type="text" id="import-category-input" placeholder="如: 风景, 人物">
    <label>标签（可选，逗号分隔）</label>
    <input type="text" id="import-tags-input" placeholder="如: 唯美, 自然">
    <div class="btns">
      <button onclick="hideImportDialog()">取消</button>
      <button class="ok" onclick="doImportUrl()">导入</button>
    </div>
  </div>
</div>

<script>
/* ====== STATE ====== */
let chatId = null;
let sending = false;
let chatImageBase64 = null;
let currentMode = 'auto';
let selectedReferences = [];   // array of GalleryPicture ids
let galleryPictures = [];      // loaded gallery pictures cache
let useGalleryRag = true;
let saveGeneratedToGallery = false;
let uploadFiles = [];  // {name, base64}[]
let templates = [];
let activeToolRecords = [];
const MSG = document.getElementById('messages');
const INPUT = document.getElementById('input');
const SEND_BTN = document.getElementById('send');
const HINT = document.getElementById('chatId-hint');
const PROGRESS = document.getElementById('progress-bar');
const PREVIEW_AREA = document.getElementById('preview-area');
const PREVIEW_IMG = document.getElementById('preview-img');

/* ====== INIT ====== */
window.onload = () => {
  loadGallery();
  loadTemplates();
};

INPUT.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !sending) {
    e.preventDefault();
    send();
  }
});
// Auto-resize textarea
INPUT.addEventListener('input', () => {
  INPUT.style.height = 'auto';
  INPUT.style.height = Math.min(INPUT.scrollHeight, 120) + 'px';
});

/* ====== TOAST ====== */
function toast(msg, ms) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._tid);
  el._tid = setTimeout(() => el.classList.remove('show'), ms || 2500);
}

/* ====== MODE ====== */
function switchMode(mode) {
  // Mode switching removed — AI agent handles intent automatically.
  // Kept for backward compatibility with any existing callers.
  currentMode = mode;
  if (mode === 'image_generation') {
    INPUT.placeholder = '描述你想要生成的图片...';
  } else if (mode === 'image_analysis') {
    INPUT.placeholder = '上传图片后点击发送，或输入补充描述...';
  } else {
    INPUT.placeholder = '描述你想做什么，AI 会自动判断...';
  }
}

/* ====== CHAT ====== */
function setChatId(id) {
  chatId = id;
  HINT.textContent = id ? '会话 ' + id.substring(0, 8) : '';
}

function showImage(data) {
  const div = document.createElement('div');
  div.className = 'bubble assistant';
  const src = data.imageUrl || data.imageBase64;
  if (src) {
    const img = document.createElement('img');
    img.src = src;
    img.onload = () => { MSG.scrollTop = MSG.scrollHeight; };
    div.appendChild(img);

      actions.className = 'image-actions';

      downloadBtn.onclick = () => {

        a.href = data.imageUrl;
        a.download = 'generated-image';
        a.click();
      };
      actions.appendChild(downloadBtn);

      saveBtn.textContent = '保存到图库';
      saveBtn.onclick = () => saveImageToGallery(data.imageUrl);
      actions.appendChild(saveBtn);
      div.appendChild(actions);

    if (promptText) {
      const details = document.createElement('details');
      details.className = 'prompt-detail';
      details.open = true;
      const summary = document.createElement('summary');
      summary.textContent = '本次使用的 Prompt';
      const pre = document.createElement('pre');
      pre.textContent = promptText;
      details.appendChild(summary);
      details.appendChild(pre);
      div.appendChild(details);
    }
  }
  MSG.appendChild(div);

function showImageCandidates(data) {
  const candidates = data && Array.isArray(data.candidates) ? data.candidates : [];
  if (!candidates.length) return;

  const div = document.createElement('div');
  div.className = 'bubble assistant';
  let html = '<div style="font-weight:600;margin-bottom:6px">找到 ' + candidates.length + ' 张相关图片</div>';
  if (data.query) {
    html += '<div style="font-size:12px;color:#666;margin-bottom:8px">搜索词：' + escHtml(data.query) + '</div>';
  }
  html += '<div class="image-candidates-grid">';
  candidates.forEach(function (candidate) {
    if (!candidate || !candidate.imageUrl) return;
    const label = candidate.title || ('来源: ' + extractHost(candidate.sourceUrl || candidate.imageUrl));
    html += renderImageBlock(candidate.imageUrl, label);
  });
  html += '</div>';
  div.innerHTML = html;
  MSG.appendChild(div);
  MSG.scrollTop = MSG.scrollHeight;
}

function formatGeneratedPrompt(data) {
  const parts = [];
  if (data.imagePrompt) parts.push('Prompt：\n' + data.imagePrompt);
  if (data.style) parts.push('风格：' + data.style);
  if (data.dimensions) parts.push('尺寸：' + data.dimensions);
  if (data.revisedPrompt) parts.push('修订提示词：\n' + data.revisedPrompt);
  return parts.join('\n\n');
}

function formatChatData(data) {
  var text = escHtml(data.message || '已完成处理');

  // Render [ID:NNN] as inline gallery thumbnails
  text = renderGalleryRefs(text);

  // Render Markdown image links and direct image URLs as inline thumbnails with save button
  text = renderImageUrls(text);

  if (data.type === 'image_generated' && data.imageUrl) {
    var imgHtml = renderImageBlock(data.imageUrl, 'AI 生成图片');
    return imgHtml + '<br>' + text;
  }
  return text;
}

/** Replace [ID:NNN] with inline gallery thumbnails + save hint */
function renderGalleryRefs(text) {
  return text.replace(/\[ID:(\d+)\]\s*([^\n]*)/g, function (match, id, name) {
    var url = '/api/gallery/files/' + id;
    return '<span class="inline-gallery-ref">' +
      '<img src="' + url + '" alt="ID:' + id + '" loading="lazy" ' +
      'onerror="this.parentElement.style.display=\'none\'" ' +
      'style="width:60px;height:60px;object-fit:cover;border-radius:4px;border:1px solid #e8e8e8;display:inline-block;margin:2px;cursor:pointer" ' +
      'onclick="showImage({imageUrl:' + jsString(url) + ',message:' + jsString(name || '') + '})">' +
      '<br><span style="font-size:10px;color:#888">图库 ID:' + id + '</span>' +
      '</span>';
  });
}

/** Detect image URLs in text and render as clickable thumbnails with save button */
function renderImageUrls(text) {
  var rendered = new Set();

  // Markdown image syntax: ![alt](url)
  text = text.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/gi, function (match, alt, url) {
    var cleanUrl = cleanupUrl(url);
    rendered.add(cleanUrl);
    return renderImageBlock(cleanUrl, alt || ('来源: ' + extractHost(cleanUrl)));
  });

  // Labeled Markdown link: 图片URL: [点击查看](url)
  var labeledMarkdownRegex = /((?:图片URL|Image URL)\s*[:：]\s*)\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/gi;
  text = text.replace(labeledMarkdownRegex, function (match, prefix, label, url) {
    var cleanUrl = cleanupUrl(url);
    rendered.add(cleanUrl);
    return prefix + renderImageBlock(cleanUrl, label || ('来源: ' + extractHost(cleanUrl)));
  });

  // Labeled bare URL: 图片URL: https://...
  var labeledRegex = /((?:图片URL|Image URL)\s*[:：]\s*)(https?:\/\/[^\s，。；;]+)/gi;
  text = text.replace(labeledRegex, function (match, prefix, url) {
    var cleanUrl = cleanupUrl(url);
    if (rendered.has(cleanUrl)) return prefix + url;
    rendered.add(cleanUrl);
    return prefix + renderImageBlock(cleanUrl, '来源: ' + extractHost(cleanUrl));
  });

  // Direct image URL with common extension.
  var imgRegex = /(https?:\/\/\S+\.(?:png|jpg|jpeg|webp|gif|bmp)(?:\?\S*)?)/gi;
  return text.replace(imgRegex, function (url) {
    var cleanUrl = cleanupUrl(url);
    if (rendered.has(cleanUrl)) return url;
    rendered.add(cleanUrl);
    return renderImageBlock(cleanUrl, '来源: ' + extractHost(cleanUrl));
  });
}

function cleanupUrl(url) {
  return (url || '').replace(/&amp;/g, '&').replace(/[)\]}>'"，。；;]+$/g, '');
}

function renderImageBlock(url, sourceLabel) {
  var safeUrl = escAttr(url);
  var safeLabel = escHtml(sourceLabel);
  var saveBtn = '<button class="save-to-gallery-btn" onclick="saveImageToGallery(' + jsString(url) + ')">' +
    '⬇ 保存到图库</button>';
  return '<div class="chat-image-block">' +
    '<img src="' + safeUrl + '" alt="' + safeLabel + '" loading="lazy" ' +
    'onerror="this.parentElement.style.display=\'none\'" ' +
    'onclick="showImage({imageUrl:' + jsString(url) + '})" ' +
    'style="max-width:200px;max-height:200px;object-fit:contain;border-radius:8px;border:1px solid #e8e8e8;cursor:pointer;display:block;margin:4px 0">' +
    '<div style="font-size:10px;color:#888;margin-top:2px">' + safeLabel + '</div>' +
    saveBtn +
    '</div>';
}

function extractHost(url) {
  try { var u = new URL(url); return u.hostname; } catch(e) { return '外部图片'; }
}

/** Save an image URL to the gallery */
async function saveImageToGallery(url) {
  toast('正在导入图库...', 5000);
  try {
    var resp = await fetch('/api/gallery/import-url', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({imageUrl: url, name: 'web-import-' + Date.now(), category: 'web-import'})
    });
    var result = await resp.json();
    if (result.code === 0) {
      toast('已保存到图库 [ID:' + result.data.id + ']', 4000);
      loadGallery();
    } else {
      toast('保存失败: ' + (result.message || '未知错误'), 4000);
    }
  } catch (e) {
    toast('网络异常: ' + e.message, 4000);
  }
}

function send() {
  const text = INPUT.value.trim();
  if (sending) return;
  if (!text && !chatImageBase64) return;

  sending = true;
  SEND_BTN.disabled = true;
  INPUT.value = '';
  INPUT.style.height = 'auto';
  INPUT.focus();

  const displayText = text || '分析这张图片';
  addBubble('user', displayText);
  const assistantBubble = addBubble('assistant', '', 'streaming');
  let fullText = '';

  // Clear right panel debug sections for new request
  clearDebugSections();

  const body = {
    message: displayText,
    chatId: chatId,
    imageBase64: chatImageBase64 || null,
    referencePictureIds: selectedReferences,
    useGalleryRag: useGalleryRag,
    referenceMode: document.getElementById('reference-mode').value,
    styleTemplateCode: getSelectedTemplateCode(),
    saveGeneratedToGallery: saveGeneratedToGallery
  };

  fetch('/api/chat/stream', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(async resp => {
    clearImage();
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        try {
          const event = JSON.parse(line.slice(5).trim());
          handleStreamEvent(event, assistantBubble, fullText);
          if (event.type === 'token') fullText += event.content;
        } catch (e) { /* skip bad lines */ }
      }
    }
  }).catch(e => {
    completeActiveToolRecords('error');
    assistantBubble.className = 'bubble error';
    assistantBubble.textContent = '网络异常，请重试';
    PROGRESS.style.display = 'none';
  }).finally(() => {
    sending = false;
    SEND_BTN.disabled = false;
    INPUT.focus();
  });
}

function handleStreamEvent(event, assistantBubble, fullText) {
  switch (event.type) {
    case 'chatId':
      setChatId(event.chatId);
      break;
    case 'token':
      assistantBubble.textContent = fullText + event.content;
      MSG.scrollTop = MSG.scrollHeight;
      break;
    case 'done':
      completeActiveToolRecords('complete');
      if (event.data) {
        assistantBubble.innerHTML = formatChatData(event.data);
      }
      PROGRESS.style.display = 'none';
      MSG.scrollTop = MSG.scrollHeight;
      break;
    case 'image_candidates':
      showImageCandidates(event.data);
      MSG.scrollTop = MSG.scrollHeight;
      break;
    case 'image_generated':
      if (event.data) showImage(event.data);
      MSG.scrollTop = MSG.scrollHeight;
      break;
    case 'progress':
      showToolCall(event.content || '生成中...', 'progress');
      PROGRESS.style.display = 'block';
      MSG.scrollTop = MSG.scrollHeight;
      break;
    case 'tool_call':
      showToolCall(event.content, 'tool_call');
      PROGRESS.style.display = 'block';
      break;
    case 'error':
      completeActiveToolRecords('error');
      assistantBubble.className = 'bubble error';
      assistantBubble.textContent = event.content;
      PROGRESS.style.display = 'none';
      break;
  }
}

function showToolCall(label, type) {
  const div = document.createElement('div');
  div.className = 'tool-call-bubble active';
  const head = document.createElement('div');
  head.className = 'tc-head';
  head.innerHTML = '<span class="tc-icon">&#128736;</span><span>' + (type === 'progress' ? '进度' : '工具调用') + '</span>';
  const status = document.createElement('span');
  status.className = 'tc-status';
  status.textContent = '进行中';
  head.appendChild(status);
  div.appendChild(head);

  const body = document.createElement('div');
  body.className = 'tc-label';
  body.innerHTML = renderImageUrls(escHtml(label || '工具调用中...'));
  div.appendChild(body);

  MSG.appendChild(div);
  activeToolRecords.push({ element: div, status: status });
  MSG.scrollTop = MSG.scrollHeight;
}

function completeActiveToolRecords(state) {
  activeToolRecords.forEach(record => {
    record.element.classList.remove('active');
    record.element.classList.add(state === 'error' ? 'error' : 'complete');
    record.status.textContent = state === 'error' ? '已中止' : '已完成';
  });
  activeToolRecords = [];
}

}

/* ====== GALLERY ====== */
async function loadGallery() {
  const grid = document.getElementById('gallery-grid');
  grid.innerHTML = '<div class="gallery-loading">加载中...</div>';

  const keyword = document.getElementById('gallery-search').value.trim();
  let url = '/api/gallery/page?page=1&pageSize=60';
  if (keyword) url += '&keyword=' + encodeURIComponent(keyword);

  try {
    const resp = await fetch(url);
    const result = await resp.json();
    if (result.code === 0 && result.data) {
      galleryPictures = result.data.records;
      renderGallery(result.data.records);
    } else {
      grid.innerHTML = '<div class="placeholder">加载失败: ' + (result.message || '未知错误') + '</div>';
    }
  } catch (e) {
    grid.innerHTML = '<div class="placeholder">网络异常</div>';
  }
}

function renderGallery(pictures) {
  const grid = document.getElementById('gallery-grid');
  if (!pictures || pictures.length === 0) {
    grid.innerHTML = '<div class="placeholder">暂无图片，上传或导入添加</div>';
    return;
  }

  grid.innerHTML = pictures.map(p => {
    const isSelected = selectedReferences.includes(p.id);
    const favClass = p.favorited ? 'fav' : '';
    const imageUrl = '/api/gallery/files/' + p.id + '?t=' + (p.updateTime || '');
    return `
      <div class="gallery-card${isSelected ? ' selected' : ''}" data-id="${p.id}">
        <img src="${imageUrl}" alt="${escAttr(p.name || '')}" loading="lazy"
             onclick="selectReference(${p.id})">
        <div class="overlay">${isSelected ? '&#10003;' : '&#9744;'}</div>
        <div class="meta">
          <div class="name" title="${escAttr(p.name || '未命名')}">${escHtml(p.name || '未命名')}</div>
          <div class="row">
            <span class="star${favClass ? ' ' + favClass : ''}" onclick="event.stopPropagation();toggleFavorite(${p.id})">${favClass ? '★' : '☆'}</span>
            <span class="analyze" onclick="event.stopPropagation();analyzePicture(${p.id})">分析</span>
            <span class="delete-btn" onclick="event.stopPropagation();deletePicture(${p.id})" title="删除">&times;</span>
          </div>
        </div>
      </div>`;
  }).join('');
}

function selectReference(id) {
  const idx = selectedReferences.indexOf(id);
  if (idx >= 0) {
    selectedReferences.splice(idx, 1);
  } else {
    selectedReferences.push(id);
  }
  // Re-render gallery to update selection state
  renderGallery(galleryPictures);
  // Update right panel reference list
  renderRefList();
}

function removeReference(id) {
  const idx = selectedReferences.indexOf(id);
  if (idx >= 0) selectedReferences.splice(idx, 1);
  renderGallery(galleryPictures);
  renderRefList();
}

function renderRefList() {
  const container = document.getElementById('ref-list');
  if (selectedReferences.length === 0) {
    container.innerHTML = '<div class="ref-empty">从左侧图库点击图片添加参考</div>';
    return;
  }
  container.innerHTML = selectedReferences.map(id => {
    const p = galleryPictures.find(g => g.id === id);
    if (!p) return '';
    const imageUrl = '/api/gallery/files/' + id;
    return `
      <div class="ref-item">
        <img src="${imageUrl}" alt="${escAttr(p.name || '')}">
        <button class="del" onclick="removeReference(${id})">&times;</button>
      </div>`;
  }).join('');
}

async function toggleFavorite(id) {
  try {
    const p = galleryPictures.find(g => g.id === id);
    if (!p) return;
    const newFav = !p.favorited;
    const resp = await fetch('/api/gallery/' + id + '/favorite?favorited=' + newFav, { method: 'POST' });
    const result = await resp.json();
    if (result.code === 0) {
      // Update local cache
      const idx = galleryPictures.findIndex(g => g.id === id);
      if (idx >= 0) {
        galleryPictures[idx] = result.data;
      }
      renderGallery(galleryPictures);
      toast(newFav ? '已收藏' : '已取消收藏');
    } else {
      toast('操作失败: ' + result.message);
    }
  } catch (e) {
    toast('网络异常');
  }
}

async function analyzePicture(id) {
  console.log('[Gallery] analyzePicture id=' + id);
  var btn = event && event.target;
  if (btn) { btn.textContent = '...'; btn.style.pointerEvents = 'none'; }
  toast('正在发起AI分析...（约10秒）', 12000);
  try {
    const resp = await fetch('/api/profile/' + id + '/analyze', { method: 'POST' });
    const result = await resp.json();
    console.log('[Gallery] analyze result:', result);
    if (result.code === 0) {
      const profile = result.data;
      toast('分析完成: ' + (profile.subject || '暂无主题') + ' / ' + (profile.style || '暂无风格'), 5000);
      // Refresh gallery to show updated info
      loadGallery();
    } else {
      toast('分析失败: ' + result.message, 5000);
    }
  } catch (e) {
    console.error('[Gallery] analyze failed:', e);
    toast('网络异常: ' + e.message, 5000);
  } finally {
    if (btn) { btn.textContent = '分析'; btn.style.pointerEvents = ''; }
  }
}

async function deletePicture(id) {
  if (!confirm('确定删除该图片？此操作不可撤销。')) return;
  try {
    const resp = await fetch('/api/gallery/' + id, { method: 'DELETE' });
    const result = await resp.json();
    if (result.code === 0) {
      toast('已删除');
      const refIdx = selectedReferences.indexOf(id);
      if (refIdx >= 0) selectedReferences.splice(refIdx, 1);
      renderRefList();
      loadGallery();
    } else {
      toast('删除失败: ' + result.message);
    }
  } catch (e) {
    toast('网络异常');
  }
}

/* ====== UPLOAD ====== */
function showUploadForm() {
  document.getElementById('upload-form').classList.add('show');
  document.getElementById('upload-file-name').textContent = '未选择文件';
  uploadFiles = [];
}

function hideUploadForm() {
  document.getElementById('upload-form').classList.remove('show');
  uploadFiles = [];
}

function triggerFilePicker() {
  document.getElementById('hidden-file-input').click();
}

function onUploadFileSelect(e) {
  const files = Array.from(e.target.files);
  if (files.length === 0) return;
  uploadFiles = [];
  const label = document.getElementById('upload-file-name');
  label.textContent = '读取中...';

  let loaded = 0;
  files.forEach((file, i) => {
    const reader = new FileReader();
    reader.onload = () => {
      uploadFiles.push({ name: file.name.replace(/\.[^.]+$/, ''), base64: reader.result });
      loaded++;
      label.textContent = `已选 ${loaded}/${files.length} 个文件`;
      if (loaded === files.length) {
        // 自动填充名称为第一个文件名
        if (!document.getElementById('upload-name').value.trim()) {
          document.getElementById('upload-name').value = uploadFiles[0].name;
        }
      }
    };
    reader.readAsDataURL(file);
  });
}

async function doUpload() {
  if (uploadFiles.length === 0) {
    toast('请先选择图片文件');
    return;
  }
  if (uploading) return;
  uploading = true;
  const confirmBtn = document.querySelector('#upload-form .row button.confirm');
  const origText = confirmBtn.textContent;
  confirmBtn.disabled = true;

  const name = document.getElementById('upload-name').value.trim();
  const category = document.getElementById('upload-category').value.trim();
  const tagsStr = document.getElementById('upload-tags').value.trim();
  const tags = tagsStr ? tagsStr.split(',').map(s => s.trim()).filter(Boolean) : [];

  let ok = 0, fail = 0, dup = 0;
  for (let i = 0; i < uploadFiles.length; i++) {
    const f = uploadFiles[i];
    confirmBtn.textContent = `上传中 ${i + 1}/${uploadFiles.length}...`;
    const body = {
      imageBase64: f.base64,
      name: name || f.name,
      introduction: null,
      category: category || null,
      tags: tags.length > 0 ? tags : null
    };
    try {
      const resp = await fetch('/api/gallery/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const result = await resp.json();
      if (result.code === 0) {
        ok++;
      } else {
        fail++;
      }
    } catch (e) {
      fail++;
    }
  }

  toast(`上传完成: ${ok} 成功` + (dup > 0 ? `, ${dup} 重复` : '') + (fail > 0 ? `, ${fail} 失败` : ''));
  hideUploadForm();
  document.getElementById('upload-name').value = '';
  document.getElementById('upload-category').value = '';
  document.getElementById('upload-tags').value = '';
  document.getElementById('hidden-file-input').value = '';
  loadGallery();

  uploading = false;
  confirmBtn.textContent = origText;
  confirmBtn.disabled = false;
}

}

function hideImportDialog() {

  document.getElementById('import-url-input').value = '';
  document.getElementById('import-name-input').value = '';

}

async function doImportUrl() {
  const imageUrl = document.getElementById('import-url-input').value.trim();
  if (!imageUrl) {
    toast('请输入图片URL');
    return;
  }
  const name = document.getElementById('import-name-input').value.trim();
  const category = document.getElementById('import-category-input').value.trim();
  const tagsStr = document.getElementById('import-tags-input').value.trim();
  const tags = tagsStr ? tagsStr.split(',').map(s => s.trim()).filter(Boolean) : [];

  const body = {
    imageUrl: imageUrl,
    name: name || null,
    introduction: null,
    category: category || null,
    tags: tags.length > 0 ? tags : null
  };

  try {
    const resp = await fetch('/api/gallery/import-url', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const result = await resp.json();
    if (result.code === 0) {
      toast('导入成功');
      hideImportDialog();
      loadGallery();
    } else {
      toast('导入失败: ' + result.message);
    }
  } catch (e) {
    toast('网络异常');
  }
}

/* ====== TEMPLATES ====== */
async function loadTemplates() {
  try {
    const resp = await fetch('/api/template');
    const result = await resp.json();
    if (result.code === 0 && result.data) {
      templates = result.data;
      renderTemplateSelect(result.data);
    }
  } catch (e) {
    // templates failed to load — not critical
  }
}

function renderTemplateSelect(templateList) {
  const sel = document.getElementById('template-select');
  // Keep the first "auto" option
  sel.innerHTML = '<option value="">自动匹配</option>';
  templateList.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t.code;
    opt.textContent = t.name + ' (' + (t.category || t.scene || '通用') + ')';
    sel.appendChild(opt);
  });
}

/* ====== RAG TOGGLE ====== */
function toggleRag() {
  useGalleryRag = !useGalleryRag;
  const el = document.getElementById('rag-toggle');
  if (useGalleryRag) el.classList.add('on'); else el.classList.remove('on');
}

function toggleSave() {
  saveGeneratedToGallery = !saveGeneratedToGallery;
  const el = document.getElementById('save-toggle');
  if (saveGeneratedToGallery) el.classList.add('on'); else el.classList.remove('on');
}

/* ====== RAG DEBUG INFO ====== */
function showRagDebugInfo(debugInfo) {
  // Try to parse if it's a string
  let info = debugInfo;
  if (typeof info === 'string') {
    try { info = JSON.parse(info); } catch (e) { /* plain text */ }
  }

  if (typeof info === 'object') {
    // Retrieved pictures
    if (info.retrievedPictures && info.retrievedPictures.length > 0) {
      document.getElementById('rag-results-section').style.display = 'block';
      document.getElementById('rag-retrieved').innerHTML = info.retrievedPictures.map(p => {
        const imgUrl = '/api/gallery/files/' + p.pictureId;
        const score = p.similarityScore ? (p.similarityScore * 100).toFixed(1) + '%' : '';
        return `
          <div class="rag-card">
            <img src="${imgUrl}" alt="">
            <div class="score">${score}</div>
          </div>`;
      }).join('');
    }

    // Matched template
    if (info.matchedTemplate) {
      document.getElementById('matched-template-section').style.display = 'block';
      const t = info.matchedTemplate;
      document.getElementById('matched-template-info').innerHTML =
        '<strong>' + escHtml(t.name || t.code || '') + '</strong>' +
        (t.category ? ' / ' + escHtml(t.category) : '') +
        (t.scene ? ' / ' + escHtml(t.scene) : '');
    }

    // Enhanced prompt
    if (info.enhancedPrompt) {
      showPromptDebug(info.enhancedPrompt);
    }

    // Full raw display for unknown fields
    if (!info.retrievedPictures && !info.matchedTemplate && !info.enhancedPrompt) {
      showPromptDebug(JSON.stringify(info, null, 2));
    }
  } else if (typeof info === 'string' && info.trim()) {
    showPromptDebug(info);
  }
}

function showPromptDebug(text) {
  document.getElementById('debug-prompt-section').style.display = 'block';
  document.getElementById('debug-prompt-text').textContent = text;
  // Auto-expand the details block
  const block = document.getElementById('debug-prompt-block');
  block.open = true;
}

/* ====== HELPERS ====== */
function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function escAttr(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function jsString(s) {
  return JSON.stringify(s || '').replace(/</g, '\\u003c').replace(/>/g, '\\u003e').replace(/&/g, '\\u0026');
}
