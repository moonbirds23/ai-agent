spring:
  config:
    import:
      - classpath:rag/style-templates.yml
  ai:
    openai:
      api-key: ${ZHIPU_API_KEY:}
      base-url: https://open.bigmodel.cn/api/paas/v4
      chat:
        completions-path: /chat/completions
        options:
          model: glm-4-flash
      embedding:
        enabled: true
        embeddings-path: /embeddings
        options:
          model: embedding-2
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: ivfflat
        distance-type: cosine_distance
        dimensions: 1024
        schema-name: public
        table-name: picture_vector_store
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_agent
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  application:
    name: aiagent

app:
  rag:
    enabled: true
    top-k: 5
    min-score: 0.4
    max-context-chars: 2500
    retrieve-favorites-only: false
    vector-weight: 50.0
    keyword-weight: 15.0
    metadata-weight: 10.0
  chat-memory:
    max-messages: 50
    ttl-days: 7
    max-conversation-messages: 200
  gallery:
    cache-max-age-days: 7
    cache-cleanup-cron: "0 0 3 * * ?"
  vector:
    type: postgres

zhipu:
  api-key: ${ZHIPU_API_KEY:}
  image:
    api-key: ${ZHIPU_API_KEY:}
  vision:
    api-key: ${ZHIPU_API_KEY:}
    model: ${ZHIPU_VISION_MODEL:glm-4.5v}

server:
  port: 8231
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /doc.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
