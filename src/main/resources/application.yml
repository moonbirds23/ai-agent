spring:
  reactor:
    context-propagation: auto
  config:
    import:
      - classpath:rag/style-templates.yml
  ai:
    chat:
      client:
        observations:
          log-prompt: false
      observations:
        log-prompt: false
        log-completion: false
    tools:
      observations:
        include-content: false
    image:
      observations:
        log-prompt: false
    openai:
      api-key: ${ZHIPU_API_KEY:}
      base-url: https://open.bigmodel.cn/api/paas/v4
      chat:
        completions-path: /chat/completions
        options:
          model: glm-4-flash
      embedding:
        enabled: true
        embeddings-path: /embeddings
        options:
          model: embedding-2
    vectorstore:
      observations:
        log-query-response: false
      pgvector:
        initialize-schema: true
        index-type: ivfflat
        distance-type: cosine_distance
        dimensions: 1024
        schema-name: public
        table-name: picture_vector_store
    mcp:
      client:
        enabled: true
        name: ai-agent-image-retrieval-client
        version: 1.0.0
        request-timeout: 20s
        type: SYNC
        sse:
          connections:
            image-retrieval:
              url: ${IMAGE_RETRIEVAL_MCP_URL:http://localhost:8232}
              sse-endpoint: /sse
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_agent
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  application:
    name: aiagent
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

app:
  observability:
    agent:
      enabled: ${AGENT_OBSERVABILITY_ENABLED:true}
      pricing-enabled: ${AGENT_COST_ESTIMATION_ENABLED:true}
      pricing:
        currency: CNY
        models:
          glm-4-flash:
            input-per-million: 0
            output-per-million: 0
            version: zhipu-official-2026-07-27
  integrations:
    image-retrieval:
      mode: ${IMAGE_RETRIEVAL_MODE:local}
  prompt:
    max-system-chars: 1500
    max-task-chars: 1200
    max-memory-chars: 2500
    max-rag-chars: 2500
  rag:
    enabled: true
    top-k: 5
    min-score: 0.4
    max-context-chars: 2500
    retrieve-favorites-only: false
    vector-weight: 50.0
    keyword-weight: 15.0
    metadata-weight: 10.0
  chat-memory:
    max-messages: 50
    prompt-window-messages: 8
    max-context-chars: 3000
    enable-semantic-summary: true
    ttl-days: 7
    max-conversation-messages: 200
  gallery:
    cache-max-age-days: 7
    cache-cleanup-cron: "0 0 3 * * ?"
  vector:
    type: postgres
  web:
    enabled: true
    connect-timeout-seconds: 10
    read-timeout-seconds: 30
    max-fetch-bytes: 2097152
    max-download-bytes: 20971520
    user-agent: "Mozilla/5.0 (compatible; CloudGalleryBot/1.0)"
    search-max-results: 5
    fetch-max-chars: 3000
    proxy-host: ${WEB_PROXY_HOST:}
    proxy-port: ${WEB_PROXY_PORT:0}
    image-search-debug: false
    image-search-async-enabled: true
    image-search-save-debug-html: false
    image-search-min-relevance-score: 0.15
  pexels:
    api-key: ${PEXELS_API_KEY:}
    connect-timeout-seconds: 10
    read-timeout-seconds: 30
    search-max-results: 5
    max-download-count: 3
  api-key: ${APP_API_KEY:}
  agent:
    execution-mode: hybrid
    max-tool-calls-per-turn: 8
    max-generation-calls-per-turn: 1
    max-download-calls-per-turn: 5
    max-search-calls-per-turn: 3

zhipu:
  api-key: ${ZHIPU_API_KEY:}
  image:
    api-key: ${ZHIPU_API_KEY:}
  vision:
    api-key: ${ZHIPU_API_KEY:}
    model: ${ZHIPU_VISION_MODEL:glm-4.5v}

resilience4j:
  circuitbreaker:
    instances:
      image-retrieval-mcp:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      zhipu-vision:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      zhipu-image-gen:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      zhipu-image-download:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  retry:
    instances:
      image-retrieval-mcp:
        max-attempts: 2
        wait-duration: 300ms
      zhipu-vision:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.net.SocketTimeoutException
      zhipu-image-gen:
        max-attempts: 3
        wait-duration: 2s

server:
  port: 8231
  servlet:
    context-path: /api
  shutdown: graceful

# management 健康检查 + 就绪探针
management:
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      connect-timeout: 1s
      timeout: 5s
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:false}
        url: ${OTEL_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

# springdoc-openapi
springdoc:
  swagger-ui:
    path: /doc.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
