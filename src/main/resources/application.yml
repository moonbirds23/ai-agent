spring:
  config:
    import:
      - classpath:rag/style-templates.yml
  ai:
    openai:
      api-key: ${ZHIPU_API_KEY:}
      base-url: https://open.bigmodel.cn/api/paas/v4
      chat:
        completions-path: /chat/completions
        options:
          model: glm-4-flash
      embedding:
        enabled: true
        embeddings-path: /embeddings
        options:
          model: embedding-2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
  application:
    name: aiagent

app:
  rag:
    enabled: true
    top-k: 5
    min-score: 0.65
    max-context-chars: 2500
    retrieve-favorites-only: true

zhipu:
  api-key: ${ZHIPU_API_KEY:}
  image:
    api-key: ${ZHIPU_API_KEY:}
  vision:
    api-key: ${ZHIPU_API_KEY:}
    model: ${ZHIPU_VISION_MODEL:glm-4.5v}

server:
  port: 8231
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /doc.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
