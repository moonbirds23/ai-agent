# ============================================================
# Production profile overrides
# ============================================================

app:
  api-key: ${APP_API_KEY}
  observability:
    agent:
      enabled: ${AGENT_OBSERVABILITY_ENABLED:true}
      pricing-enabled: ${AGENT_COST_ESTIMATION_ENABLED:true}
  rag:
    enabled: true
  chat-memory:
    max-conversation-messages: 200
  pexels:
    api-key: ${PEXELS_API_KEY}

# --- Datasource (PostgreSQL via env vars) ---
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 10000

  # --- Redis via env vars ---
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms

  # --- JPA / OSIV ---
  jpa:
    open-in-view: false

# --- Zhipu / Pexels API keys ---
zhipu:
  api-key: ${ZHIPU_API_KEY}
  image:
    api-key: ${ZHIPU_API_KEY}
  vision:
    api-key: ${ZHIPU_API_KEY}


# --- Server ---
server:
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
  tomcat:
    connection-timeout: 30s

# --- Swagger disabled ---
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# --- Management endpoints ---
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_TRACES_ENDPOINT:http://jaeger:4318/v1/traces}
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:false}
        url: ${OTEL_METRICS_ENDPOINT:http://otel-collector:4318/v1/metrics}
  endpoints:
    web:
      exposure:
        include: health,info

# --- Logging ---
logging:
  level:
    root: INFO
    com.zzp.aiagent: INFO
