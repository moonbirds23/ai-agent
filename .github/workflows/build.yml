name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run main application tests
        run: mvn test
        env:
          ZHIPU_API_KEY: test-fake-key
          PEXELS_API_KEY: test-fake-key

      - name: Run MCP server tests
        run: mvn -f mcp-servers/image-retrieval-server/pom.xml test
        env:
          PEXELS_API_KEY: test-fake-key
